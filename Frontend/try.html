<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marksheet</title>
<style>
body{
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 20px;
}

.marksheet {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 20px;
  border: 2px solid #333;
}

.header {
  text-align: center;
  border-bottom: 2px solid #333;
  padding-bottom: 10px;
}

.header h1 {
  margin: 0;
}

.info {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
}

.info div {
  font-size: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

table, th, td {
  border: 1px solid #333;
}

th, td {
  padding: 10px;
  text-align: center;
}

.footer {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

button {
  margin-top: 20px;
  padding: 10px 15px;
  background: #3498db;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

button:hover {
  background: #2980b9;
}

@media print {
  button {
    display: none;
  }
}

</style>
</head>
<body>

<div class="marksheet">

  <div class="header">
    <h1>S3 College</h1>
    <p>Official Marksheet</p>
  </div>

  <div class="info">
    <div>
      <p><b>Name:</b> {{NAME}}</p>
      <p><b>Symbol No:</b> {{ID}}</p>
    </div>
    <div>
      <p><b>Semester:</b> 1st</p>
      <p><b>Program:</b> BIM</p>
    </div>
  </div>

  <table>
    <tr>
      <th>Subject</th>
      <th>Marks</th>
    </tr>

    <tr>
      <td>Math</td>
      <td>{{MATH}}</td>
    </tr>

    <tr>
      <td>English</td>
      <td>{{ENGLISH}}</td>
    </tr>

    <tr>
      <td>Computer</td>
      <td>{{COMPUTER}}</td>
    </tr>

    <tr>
      <td>Database</td>
      <td>{{DATABASE}}</td>
    </tr>
  </table>

  <div class="footer">
    <p><b>Total:</b> {{TOTAL}}</p>
    <p><b>Result:</b> {{RESULT}}</p>
  </div>

  <button onclick="window.print()">Print Marksheet</button>

</div>

</body>
</html>
